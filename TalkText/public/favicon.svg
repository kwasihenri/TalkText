<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d3d8f" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4" />

  <!-- Dynamic Audio Soundwaves (Left) -->
  <g fill="url(#accentGrad)" opacity="0.85">
    <rect x="76" y="216" width="16" height="80" rx="8" />
    <rect x="112" y="166" width="16" height="180" rx="8" />
    <rect x="148" y="126" width="16" height="260" rx="8" />
  </g>

  <!-- Central Studio Microphone / Speech Capsule -->
  <g filter="url(#glow)">
    <!-- Mic Body -->
    <rect x="216" y="112" width="80" height="160" rx="40" fill="url(#micGrad)" stroke="#ffffff" stroke-width="8" />
    
    <!-- Sound Waves / Horizontal Grille Accents on Mic -->
    <line x1="234" y1="160" x2="278" y2="160" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="230" y1="184" x2="282" y2="184" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="234" y1="208" x2="278" y2="208" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />

    <!-- Mic Cradle / U-Shape -->
    <path d="M192 216 C 192 312, 320 312, 320 216" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

    <!-- Mic Stand Stem -->
    <line x1="256" y1="312" x2="256" y2="378" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

    <!-- Base Plate -->
    <line x1="206" y1="378" x2="306" y2="378" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Dynamic Audio Soundwaves (Right) -->
  <g fill="url(#accentGrad)" opacity="0.85">
    <rect x="348" y="126" width="16" height="260" rx="8" />
    <rect x="384" y="166" width="16" height="180" rx="8" />
    <rect x="420" y="216" width="16" height="80" rx="8" />
  </g>
</svg>